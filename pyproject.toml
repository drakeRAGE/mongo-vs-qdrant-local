[project]
name = "vectordb-proof"
version = "0.1.0"
description = "Reproducible local study: MongoDB $vectorSearch vs Qdrant on one inventoried laptop."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Deepak" }]
keywords = ["vector-search", "hnsw", "mongodb", "qdrant", "benchmark"]
dependencies = [
  "numpy>=1.24",
  "pyarrow>=14.0",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "pymongo>=4.10",
  "qdrant-client>=1.12",
  "sentence-transformers>=3.0",
  "transformers>=4.40",
  "torch>=2.2",
  "datasets>=2.19",
  "huggingface_hub>=0.23",
  "tqdm>=4.66",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8"]

[project.urls]
Homepage = "https://github.com/drakeRAGE/mongo-vs-qdrant-local"
Documentation = "https://github.com/drakeRAGE/mongo-vs-qdrant-local/tree/main/docs"
Repository = "https://github.com/drakeRAGE/mongo-vs-qdrant-local"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
